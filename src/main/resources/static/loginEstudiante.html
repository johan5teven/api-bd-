<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - TalentNetworkUEB</title>
    
    <link rel="stylesheet" href="css/styleslogin.css" />
    <link rel="stylesheet" href="css/registerlogin.css" />
    <link rel="icon" href="images/icon.png" />
</head>
<body>
     <header>
		<div class="logo">
			<a href="index.html"> 
				<img src="images/imagotipo.png" alt="Talent Network UEB" />
			</a>
		</div>

		<nav class="header-button">
			<ul>
				<li>
                            <a href="login.html">Iniciar sesión</a>
  
        </li>
			</ul>
		</nav>
	</header>

   <div class="container-in">
        <div class="forms">
            <div class="header-login">
                <div class="loginTitle"><h1>Iniciar Sesión</h1></div>
                <div class="line"></div>
            </div>
                        <div class="login">

  <form id="loginForm">
    <label for="correo">Correo electrónico </label>
    <input type="email" id="correo" name="correo" required><br>

    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" required><br>

    <button type="submit">Ingresar</button>
  </form>
  <p id="mensaje" style="color:rgb(233, 103, 103);"></p>
                        </div>
        </div>
   </div>

   <footer>
        <p>
            &copy; 2025 Talent Network UEB&nbsp;  &nbsp;Bases de datos 2&nbsp;  &nbsp;
            Universidad El Bosque
        </p>
    </footer>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const correo = document.getElementById("correo").value;
      const contrasena = document.getElementById("contrasena").value;

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ correo, contrasena })
        });

        if (response.ok) {
          // backend returns JSON like { redirect: "/dashboardX.html", rol: "..." }
          const data = await response.json();
          if (data && data.redirect) {
            window.location.href = data.redirect;
          } else {
            document.getElementById("mensaje").textContent = 'Respuesta inesperada del servidor';
          }
        } else {
          const error = await response.text();
          document.getElementById("mensaje").textContent = error;
        }
      } catch (err) {
        document.getElementById("mensaje").textContent = "Error de conexión con el servidor.";
      }
    });
  </script>
  
</body>
</html>
