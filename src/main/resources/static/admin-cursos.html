<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cursos - Admin</title>
</head>
<body>
    <h1>Gestión de Cursos</h1>
    <div id="sessionInfo"></div>

    <nav>
        <a href="/dashboardAdmin.html">🏠 Inicio</a> |
        <a href="/admin-cursos.html">📘 Cursos</a> |
        <a href="/admin-inscripciones.html">Inscripciones</a> |
        <a href="/admin-pagos.html">Pagos</a> |
        <a href="/admin-tutores.html">Tutores</a> |
        <a href="/admin-reportes.html">Reportes</a> |
        <a href="/admin-materiales.html">Materiales</a> |
        <a href="/logout">Cerrar sesión</a>
    </nav>

    <section id="crear">
        <h2>Agregar nuevo curso</h2>
        <form id="formCurso">
            <label>Título:</label>
            <input type="text" id="titulo" name="titulo" required><br>

            <label>Descripción:</label>
            <textarea id="descripcion" name="descripcion" required></textarea><br>

            <label>Modalidad:</label>
            <select id="modalidad" name="modalidad" required>
                <option value="presencial">Presencial</option>
                <option value="virtual">Virtual</option>
            </select><br>

            <label>Fecha de inicio:</label>
            <input type="date" id="fecha_inicio" name="fecha_inicio" required><br>

            <label>Fecha de fin:</label>
            <input type="date" id="fecha_fin" name="fecha_fin" required><br>

            <label>Precio:</label>
            <input type="number" id="precio" name="precio" step="0.01" required><br>

            <label>Tutor (ID):</label>
            <input type="number" id="id_tutor" name="id_tutor" required><br>

            <button type="submit">Guardar curso</button>
        </form>
    </section>

    <hr>

    <section id="listar">
        <h2>Lista de Cursos</h2>
        <table border="1" id="tablaCursos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Modalidad</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Precio</th>
                    <th>Estado</th>
                    <th>Tutor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script src="/js/admin-cursos.js"></script>
    <script src="/js/admin-session.js"></script>
</body>
</html>
