<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<title>Talent Network UEB - Panel Estudiante</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="icon" href="images/icono.png" />
</head>
<body>
	<header>
		<div class="logo">
			<a href="index.html"> 
				<img src="images/imagotipo.png" alt="Talent Network UEB" />
			</a>
		</div>
        <h1>Dashboard Tutor</h1>

		<nav class="header-button">
			<ul>
				<li><button id="logoutBtn" href="/logout">Cerrar Sesión</button></li>
			</ul>
		</nav>
	</header>

<section id="panel">
</section>
<script>
	async function checkSession() {
		try {
			const res = await fetch('/api/auth/session');
			if (res.status === 200) {
				const body = await res.json();
				document.getElementById('sessionInfo').innerText = 'Conectado como: ' + (body.correo || body.id);
			} else {
				window.location.href = '/login.html';
			}
		} catch (e) {
			console.error(e);
		}
	}

	document.getElementById('logoutBtn').addEventListener('click', async () => {
		await fetch('/api/auth/logout', { method: 'POST' });
		window.location.href = '/login.html';
	});

	checkSession();
</script>
</body>
<footer>
		<p>
			&copy; 2025 Talent Network UEB&nbsp;&nbsp;Bases de datos 2&nbsp;&nbsp;Universidad El Bosque
		</p>
	</footer>
</html>
