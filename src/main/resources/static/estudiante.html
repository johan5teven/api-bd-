<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Servicios - Estudiante</title>
  <script defer src="/js/estudiante.js"></script>
  <script defer src="/js/estudiante-session.js"></script>
  <style>
    body{font-family:Arial;padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .card{border:1px solid #ddd;padding:12px;border-radius:6px;background:#fff}
    .card h3{margin:0 0 8px}
  </style>
</head>
<body>
  <h1>Servicios disponibles</h1>
  <div style="margin-bottom:12px">
    <button id="logoutBtn">Cerrar sesión</button>
    <span id="sessionInfo" style="margin-left:8px"></span>
  </div>
  <h2>Cursos</h2>
  <div id="cursos" class="grid"></div>
  <h2>Libros y Productos</h2>
  <div id="productos" class="grid"></div>
  <h2>Materiales</h2>
  <div id="materiales" class="grid"></div>
  <h2>Guías / Blogs</h2>
  <div id="guias" class="grid"></div>
  <hr>
  <h2>Comprar Agendamiento</h2>
  <div style="max-width:600px">
    <label>Tu id de estudiante (temporal): <input id="estId" type="number" placeholder="1"></label>
    <label>Tutor: <select id="selTutor"></select></label>
    <label>Tier: <select id="selTier"><option value="basico">Básico ($30)</option><option value="mid">Intermedio ($60)</option><option value="pro">Pro ($120)</option></select></label>
    <button id="btnComprar">Comprar agendamiento</button>
  </div>

  <h2>Servicios adquiridos</h2>
  <div id="adquiridos"></div>
</body>
</html>
