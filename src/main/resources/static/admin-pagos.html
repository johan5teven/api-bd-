<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Pagos</title>
  <script defer src="/js/admin-pagos.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 8px; border: 1px solid #ddd; }
    th { background: #f4f4f4; }
    .form-row { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Gestión de Pagos</h1>
  <div id="sessionInfo"></div>

  <nav>
    <a href="/dashboardAdmin.html">Inicio</a> |
    <a href="/admin-cursos.html">Cursos</a> |
    <a href="/admin-inscripciones.html">Inscripciones</a> |
    <a href="/admin-pagos.html">Pagos</a> |
    <a href="/admin-tutores.html">Tutores</a> |
    <a href="/admin-reportes.html">Reportes</a> |
    <a href="/admin-materiales.html">Materiales</a> |
    <a href="/logout">Cerrar sesión</a>
  </nav>

  <section>
    <h2>Buscar pagos por usuario</h2>
    <div class="form-row">
      <input id="usuarioId" type="number" placeholder="ID Usuario">
      <button id="btnBuscar">Buscar</button>
      <button id="btnListar">Listar todos</button>
    </div>
    <ul id="mensajes"></ul>
    <table id="tablaPagos">
      <thead><tr><th>ID Pago</th><th>ID Orden</th><th>ID Usuario</th><th>Método</th><th>Fecha</th><th>Monto</th><th>Estado</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section style="margin-top:24px;">
    <h2>Registrar pago</h2>
    <div class="form-row">
      <label>ID Orden: <input id="regOrden" type="number"></label>
    </div>
    <div class="form-row">
      <label>Método: <select id="regMetodo"><option>tarjeta</option><option>transferencia</option><option>otro</option></select></label>
    </div>
    <div class="form-row">
      <label>Monto: <input id="regMonto" type="number" step="0.01"></label>
    </div>
    <button id="btnRegistrar">Registrar Pago</button>
  </section>
  <script src="/js/admin-session.js"></script>
</body>
</html>
