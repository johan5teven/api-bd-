<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pagos - Admin - TalentNetworkUEB</title>

  <link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="stylesheet" href="css/catalog.css" />
<link rel="icon" href="images/icono.png" />
</head>
<body>
   <header>
		<div class="logo">
			<a href="index.html"> 
				<img src="images/imagotipo.png" alt="Talent Network UEB" />
			</a>
		</div>
        <h1>Gestión de Pagos</h1>

		<nav class="header-button">
			<ul>
				<li><button id="logoutBtn" href="/logout">Cerrar Sesión</button></li>
			</ul>
		</nav>
	</header>
  <div id="sessionInfo"></div>

  <nav id="navadmin">
        <a href="/dashboardAdmin.html">🏠 Inicio</a> |
        <a href="/admin-cursos.html">📘 Cursos</a> |
        <a href="/admin-inscripciones.html">📝 Inscripciones</a> |
        <a href="/admin-pagos.html">💳 Pagos</a> |
        <a href="/admin-tutores.html">👨‍🏫 Tutores</a> |
        <a href="/admin-reportes.html">📊 Reportes</a> |
        <a href="/admin-materiales.html">📚 Materiales</a> |
    </nav>

  <section id="listar">
    <h2>Buscar pagos por usuario</h2>
        <div class="scontainer">

    <form class="filtrarform">
      <input id="usuarioId" type="number" placeholder="ID Usuario">
  <button type="submit" class="btnsearch">
          <i class="pi pi-search"></i> 
            <img src="images/search.png" alt="Buscar" style="width:15px; height:15px; vertical-align:middle; ">

        </button>    
        
    </form>
        </div>
    <ul id="mensajes"></ul>
      <button id="btnListar">Listar todos</button>
    <table id="tablaPagos">
      <thead><tr><th>ID Pago</th><th>ID Orden</th><th>ID Usuario</th><th>Método</th><th>Fecha</th><th>Monto</th><th>Estado</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="crear">
    <h2>Registrar pago</h2>
        <form id="formInscribir">
            
      <label>ID Orden: <input id="regOrden" type="number"></label>
      <label>Método:<br><br> <select id="regMetodo"><option>tarjeta</option><option>transferencia</option><option>otro</option></select></label>
      <label>Monto: <input id="regMonto" type="number" step="0.01"></label>
    <button id="btnRegistrar">Registrar Pago</button>
    </form>
  </section>
  <script src="/js/admin-session.js"></script>
</body>
<footer>
